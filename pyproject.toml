[project]
name = "financial-analyst-agent"
version = "3.0.0"
description = "Agentic evidence-grounded financial research with deterministic analytics."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "langchain-anthropic>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langchain-google-genai>=3.0,<5",
    "langchain-ollama>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langgraph>=1.0,<2",
    "pandas>=2.2,<4",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pymupdf>=1.25,<2",
    "requests>=2.32,<3",
    "streamlit>=1.45,<2",
    "yfinance>=0.2.54,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["financial_analyst*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "_validation_venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
